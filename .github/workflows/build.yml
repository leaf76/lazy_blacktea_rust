name: Build (macOS, Linux, Windows)

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg,app
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: Install JS dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        env:
          # Windows: embed Common Controls v6 for the lib test harness only
          # (see src-tauri/build.rs). Must not be set during `tauri build`.
          LAZY_BLACKTEA_TEST_MANIFEST: "1"
        # Use --lib so we do not also link smoke/soak unit-test harnesses with
        # a second MANIFEST on top of tauri-build's resource (CVT1100/LNK1123).
        run: cargo test --lib --all-features

      - name: Build Tauri bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Smoke test Linux AppImage launch
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#appimages[@]}" -gt 0 ]; then
            APPIMAGE="${appimages[0]}"
            chmod +x "$APPIMAGE"
            echo "Smoke testing AppImage launch under xvfb: $APPIMAGE"
            xvfb-run --auto-servernum "$APPIMAGE" --appimage-extract-and-run &
            PID=$!
            sleep 5
            if kill -0 "$PID" 2>/dev/null; then
              echo "Smoke test passed: AppImage launched successfully."
              kill -15 "$PID" 2>/dev/null || true
            else
              wait "$PID"
              EXIT_CODE=$?
              echo "Smoke test failed: AppImage crashed on launch with exit code $EXIT_CODE"
              exit 1
            fi
          fi

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
